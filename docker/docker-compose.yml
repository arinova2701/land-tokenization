services:
  node1:
    image: hyperledger/besu:latest
    container_name: besu-node1
    volumes:
      - ./genesis.json:/genesis.json:ro
      - ./nodes/node1:/keys:ro
      - node1-data:/data
    command: >
      --data-path=/data
      --genesis-file=/genesis.json
      --node-private-key-file=/keys/key
      --rpc-http-enabled
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-api=ETH,NET,QBFT,ADMIN,TXPOOL
      --rpc-ws-enabled
      --rpc-ws-host=0.0.0.0
      --rpc-ws-port=8546
      --host-allowlist="*"
      --rpc-http-cors-origins="all"
      --p2p-port=30303
      --p2p-host=172.28.0.10
      --min-gas-price=0
    networks:
      besu-net:
        ipv4_address: 172.28.0.10
    ports:
      - "8545:8545"
      - "8546:8546"

  node2:
    image: hyperledger/besu:latest
    container_name: besu-node2
    volumes:
      - ./genesis.json:/genesis.json:ro
      - ./nodes/node2:/keys:ro
